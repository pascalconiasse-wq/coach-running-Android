{"name":"Build APK","on":{"workflow_dispatch":{},"push":{"branches":["main"]}},"jobs":{"build":{"runs-on":"ubuntu-24.04","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"if":"always()","run":"echo \"::notice::racine: $(ls | tr '\\n' ' ') -- sous-dossier: $(ls CoachRunningAndroid 2>&1 | tr '\\n' ' ')\""},{"run":"set -o pipefail; cd $(dirname $(find . -name settings.gradle.kts | head -1)); sed -i 's/8\\.5\\.2/8.6.1/' build.gradle.kts; sed -i 's/compileSdk = 34/compileSdk = 35/' app/build.gradle.kts; gradle assembleDebug --console=plain 2>&1 | tee $GITHUB_WORKSPACE/build.log"},{"if":"failure()","run":"m=$(grep -E 'e: |error:|What went wrong|Dependency|requires|Unresolved|does not contain' -A2 build.log | head -50 | tr '\\n' '|'); echo \"::error::${m:-pas de journal gradle}\""},{"if":"always()","uses":"actions/upload-artifact@v4","with":{"name":"build-log","path":"build.log","if-no-files-found":"ignore"}},{"uses":"actions/upload-artifact@v4","with":{"name":"coach-running-apk","path":"**/app-debug.apk"}}]}}}
