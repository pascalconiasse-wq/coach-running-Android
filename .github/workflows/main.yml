{"name": "Build APK", "on": {"push": {"branches": ["**"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-24.04", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Compiler", "run": "set -e\nRUN=${{ github.run_number }}\nLAST=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null | sed -E 's/^v1\\.//' | grep -E '^[0-9]+$' || echo 0)\nN=$((LAST+1))\necho \"Prochaine version officielle : 1.$N (code $RUN)\"\nD=$(dirname \"$(find . -name settings.gradle.kts | head -1)\")\necho \"Projet: $D\"\nif [ -n \"$KEYSTORE_BASE64\" ] && [ -n \"$KEYSTORE_PASSWORD\" ]; then\n  echo \"$KEYSTORE_BASE64\" | base64 -d > \"$RUNNER_TEMP/coach.jks\"\n  export KEYSTORE_FILE=\"$RUNNER_TEMP/coach.jks\"\n  echo \"Signature : cle des secrets GitHub\"\nelse\n  echo \"Signature : cle debug.keystore du depot (secrets absents)\"\n  mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore\nfi\nG=\"$D/app/build.gradle.kts\"\ngrep -q 'versionCode' \"$G\" || { echo \"::error::versionCode introuvable dans $G\"; exit 1; }\nsed -i -E \"s/versionCode = [0-9]+/versionCode = $RUN/; s/versionName = \\\"[^\\\"]*\\\"/versionName = \\\"1.$N\\\"/\" \"$G\"\nsed -i 's/8\\.5\\.2/8.6.1/g' \"$D/build.gradle.kts\" 2>/dev/null || true\nsed -i -E 's/compileSdk = 34/compileSdk = 35/' \"$G\"\ncd \"$D\"\ngradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || { grep -E \"error:|e: |FAILED|What went wrong\" -A3 /tmp/build.log | head -40 | sed 's/^/::error::/'; exit 1; }\ncd - >/dev/null\nAPK=$(find \"$D\" -name app-debug.apk | head -1)\ncp \"$APK\" coach-running.apk\necho \"VERSION=1.$N\" >> $GITHUB_ENV\nK=$(gh api \"repos/${{ github.repository }}/releases?per_page=100\" --jq \"[.[]|select(.tag_name|startswith(\\\"test-1.$N-\\\"))]|length\" 2>/dev/null || echo 0)\necho \"TESTK=$((K+1))\" >> $GITHUB_ENV", "env": {"KEYSTORE_BASE64": "${{ secrets.KEYSTORE_BASE64 }}", "KEYSTORE_PASSWORD": "${{ secrets.KEYSTORE_PASSWORD }}", "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}}, {"uses": "actions/upload-artifact@v4", "with": {"name": "coach-running-apk", "path": "coach-running.apk"}}, {"name": "Publier la version officielle", "if": "github.ref_name == 'main'", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v${{ env.VERSION }}", "name": "Coach Running ${{ env.VERSION }}", "files": "coach-running.apk", "make_latest": "true"}}, {"name": "Publier en préversion (test)", "if": "github.ref_name != 'main'", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "test-${{ env.VERSION }}-${{ env.TESTK }}", "name": "TEST ${{ env.VERSION }} n°${{ env.TESTK }} (non diffusée)", "files": "coach-running.apk", "prerelease": true, "make_latest": "false"}}, {"name": "Supprimer les préversions devenues inutiles", "if": "github.ref_name == 'main'", "env": {"GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}, "run": "for t in $(gh api \"repos/${{ github.repository }}/releases?per_page=100\" --jq '.[]|select(.prerelease)|.tag_name'); do gh release delete \"$t\" --cleanup-tag --yes --repo ${{ github.repository }} || true; done"}]}}}