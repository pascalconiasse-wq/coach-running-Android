yaml
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coach-running-apk
          path: app/build/outputs/apk/debug/app-debug.apk
Laisse le nom main.yml, il convient. Clique sur Commit changes…, puis de nouveau sur Commit changes.

2. Vérifie le contenu du dépôt

Va dans l’onglet Code. Tu dois voir à la racine le dossier app, le dossier gradle et les fichiers build.gradle.kts, settings.gradle.kts et gradle.properties.
S’il n’y a que index.html ou un seul dossier, l’envoi n’a pas pris tout le contenu. Dans ce cas :
Sur la page du dépôt, clique sur Add file, puis Upload files.
Dézippe CoachRunningAndroid.zip sur ton PC et ouvre le dossier.
Glisse tout son contenu dans la zone, dossier app compris. Si le navigateur n’accepte pas les dossiers, envoie les fichiers de la racine d’abord, puis le dossier app.
Clique sur Commit changes.

Dis-moi ce que tu vois dans l’onglet Code, et si la compilation démarre dans Actions après ces étapes.
