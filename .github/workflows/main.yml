{"name": "Build APK", "on": {"push": {"branches": ["main", "master"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-24.04", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Compiler", "run": "set -e\nN=${{ github.run_number }}\nD=$(dirname \"$(find . -name settings.gradle.kts | head -1)\")\necho \"Projet: $D\"\nmkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore\nG=\"$D/app/build.gradle.kts\"\ngrep -q 'versionCode' \"$G\" || { echo \"::error::versionCode introuvable dans $G\"; exit 1; }\nsed -i -E \"s/versionCode = [0-9]+/versionCode = $N/; s/versionName = \\\"[^\\\"]*\\\"/versionName = \\\"1.$N\\\"/\" \"$G\"\nsed -i 's/8\\.5\\.2/8.6.1/g' \"$D/build.gradle.kts\" 2>/dev/null || true\nsed -i -E 's/compileSdk = 34/compileSdk = 35/' \"$G\"\ncd \"$D\"\ngradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || { grep -E \"error:|e: |FAILED|What went wrong\" -A3 /tmp/build.log | head -40 | sed 's/^/::error::/'; exit 1; }\ncd - >/dev/null\nAPK=$(find \"$D\" -name app-debug.apk | head -1)\ncp \"$APK\" coach-running.apk\necho \"VERSION=1.$N\" >> $GITHUB_ENV"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "coach-running-apk", "path": "coach-running.apk"}}, {"name": "Publier la version", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v${{ env.VERSION }}", "name": "Coach Running ${{ env.VERSION }}", "files": "coach-running.apk", "make_latest": "true"}}]}}}
