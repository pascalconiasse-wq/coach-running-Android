name: Compiler l'APK

# Chaque envoi fabrique une version de TEST (non proposée en mise à jour).
# Un envoi dont le message contient [publier] fabrique la version officielle.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Type de version
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          N=$(( $(grep '^PUBLIE=' app/version.properties | cut -d= -f2) + 1 ))
          echo "NUMERO=$N" >> $GITHUB_ENV
          if echo "$MSG" | grep -q '\[publier\]'; then
            echo "TAG=appel-station-v$N" >> $GITHUB_ENV
            echo "NOM=Appel Station 1.$N" >> $GITHUB_ENV
            echo "SUFFIXE_VERSION=" >> $GITHUB_ENV
          else
            echo "TAG=appel-test-${{ github.run_number }}" >> $GITHUB_ENV
            echo "NOM=Appel Station 1.$N TEST ${{ github.run_number }}" >> $GITHUB_ENV
            echo "SUFFIXE_VERSION= test ${{ github.run_number }}" >> $GITHUB_ENV
          fi
      - name: Compiler
        env:
          APPEL_STATION_KEY_PASSWORD: ${{ secrets.APPEL_STATION_KEY_PASSWORD }}
        run: |
          if [ -z "$APPEL_STATION_KEY_PASSWORD" ]; then echo "::error::Secret APPEL_STATION_KEY_PASSWORD absent"; exit 1; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || { grep -E "error:|e: |FAILED|What went wrong" -A3 /tmp/build.log | head -40 | sed 's/^/::error::/'; exit 1; }
          cp app/build/outputs/apk/release/*.apk AppelStation.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppelStation-apk
          path: AppelStation.apk
      - name: Mettre en ligne (pré-version, ne touche pas aux mises à jour de Coach Running)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.NOM }}
          files: AppelStation.apk
          prerelease: true
          make_latest: "false"
