name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || { grep -E "error:|e: |FAILED|What went wrong" -A3 /tmp/build.log | head -40 | sed 's/^/::error::/'; exit 1; }
          cp app/build/outputs/apk/release/*.apk AppelStation.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppelStation-apk
          path: AppelStation.apk
      - name: Publier (pré-version, ne touche pas aux mises à jour de Coach Running)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appel-station-v${{ github.run_number }}
          name: Appel Station ${{ github.run_number }}
          files: AppelStation.apk
          prerelease: true
          make_latest: "false"
